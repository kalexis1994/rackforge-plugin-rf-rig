name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rf-rig-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --release --workspace
      - name: Generated metadata is up to date
        run: cargo run --locked --release -p rf-rig-lab -- metadata --check
      - name: Build the portable component
        run: cargo build --locked --release -p rackforge-rf-rig --target wasm32-unknown-unknown
      - name: The component still starts in the host runtime
        run: cargo test --locked --release -p rf-rig-lab --test component_instantiates

  rfplugin:
    name: Portable .rfplugin
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out RF-Rig
        uses: actions/checkout@v6
      - name: Check out the pinned RackForge packager
        uses: actions/checkout@v6
        with:
          repository: kalexis1994/rackforge
          ref: ab7bcba8bc1f7b03ce32e69399c232a8d8b91bf4
          path: .rackforge
          persist-credentials: false
      - name: Set up Rust and the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .rackforge/target
          key: ${{ runner.os }}-${{ runner.arch }}-rf-rig-package-${{ hashFiles('Cargo.lock', '.rackforge/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rf-rig-package-
      - name: Build the RF-Rig package
        id: package
        env:
          RACKFORGE_ROOT: ${{ github.workspace }}/.rackforge
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' plugin/package/rackforge-plugin.toml | head -n 1)"
          test -n "$version"
          output="$GITHUB_WORKSPACE/artifacts/RF-Rig.rfplugin"
          bash tools/build-package.sh "$output"
          digest="$(sha256sum "$output" | awk '{print $1}')"
          printf '%s  %s\n' "$digest" "$(basename "$output")" > "$output.sha256"
          echo "artifact_name=RF-Rig-$version-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact=$output" >> "$GITHUB_OUTPUT"
      - name: Upload the package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.artifact }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
