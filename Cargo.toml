[workspace]
resolver = "3"
members = [
    "crates/rf-rig-contract",
    "crates/rf-rig-dsp",
    "crates/rf-rig-lab",
    "plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/kalexis1994/rackforge-plugin-rf-rig"

[workspace.dependencies]
rf-rig-contract = { path = "crates/rf-rig-contract" }
rf-rig-dsp = { path = "crates/rf-rig-dsp" }
libm = "0.2"

# Portable RackForge ABI used by the processor adapter. Local contributors can
# override this revision with `.cargo/config.toml.example`.
rackforge-plugin-sdk = { git = "https://github.com/kalexis1994/rackforge.git", rev = "ab7bcba8bc1f7b03ce32e69399c232a8d8b91bf4" }

# The host's own runtime, used by one test: the packaged component must be able
# to start. See crates/rf-rig-lab/tests/component_instantiates.rs.
rackforge-plugin-runtime = { git = "https://github.com/kalexis1994/rackforge.git", rev = "ab7bcba8bc1f7b03ce32e69399c232a8d8b91bf4" }
